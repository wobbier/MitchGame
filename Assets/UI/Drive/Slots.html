<html>
<head>
<style type="text/css">
    html, body { margin: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
    #prompt { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; color: #ffe27a;
              font-size: 26px; font-weight: bold; text-shadow: 0 0 6px #000, 0 0 2px #000; display: none; }
    #machine { position: absolute; left: 50%; top: 14%; width: 520px; margin-left: -260px; display: none;
               background: linear-gradient(#8b1010, #4a0606); border: 6px solid #f2c230; border-radius: 22px;
               box-shadow: 0 0 30px rgba(255, 190, 40, 0.6); padding: 18px 22px 22px; color: white; text-align: center; }
    #title { font-size: 30px; font-weight: bold; color: #ffd84a; letter-spacing: 4px; text-shadow: 0 2px 0 #600; }
    #credits { font-size: 16px; color: #ffe9b0; margin: 4px 0 12px; }
    #reels { display: flex; justify-content: space-between; }
    .reel { width: 140px; height: 150px; background: linear-gradient(#ddd, #fff 45%, #fff 55%, #bbb);
            border: 4px solid #222; border-radius: 10px; font-size: 84px; line-height: 150px; font-weight: bold; }
    .s0 { color: #d01818; } .s1 { color: #222; font-size: 54px; } .s2 { color: #e0258a; } .s3 { color: #e8a800; }
    .s3 svg, .s4 svg { vertical-align: middle; }
    .spinning { filter: blur(2px); }
    #result { height: 40px; margin-top: 14px; font-size: 24px; font-weight: bold; color: #fff3a0; white-space: nowrap; }
    #result.jackpot { color: #7dff6a; font-size: 22px; animation: flash 0.25s infinite alternate; }
    @keyframes flash { from { opacity: 1; } to { opacity: 0.35; } }
    #hint { font-size: 13px; color: #f6cfcf; }
</style>
</head>
<body>
<!-- Never let the page paint nothing: the engine keeps showing the last UI frame when it does. -->
<div id="keepalive" style="position:absolute;left:0;top:0;width:1px;height:1px;background:rgba(0,0,0,0.01)"></div>
<div id="prompt">Press E to play the slots</div>
<div id="machine">
    <div id="title">NUCLEAR SEVENS</div>
    <div id="credits">Credits: 100</div>
    <div id="reels"><div class="reel s0" id="r0">7</div><div class="reel s0" id="r1">7</div><div class="reel s0" id="r2">7</div></div>
    <div id="result"></div>
    <div id="hint">E to spin &middot; three radiation symbols is the MAX WIN</div>
</div>
<script>
    // The UI font has no star or radiation glyphs, so those two are images.
    var STAR = '<img src="Star.png" width="100" height="100" style="vertical-align: middle">';
    var NUKE = '<img src="Nuke.png" width="110" height="110" style="vertical-align: middle">';
    var SYMBOLS = ["7", "BAR", "\u2665", STAR, NUKE];
    var timers = [];

    function setReel(i, s) {
        var el = document.getElementById("r" + i);
        el.innerHTML = SYMBOLS[s];
        el.className = "reel s" + s;
    }
    function setPrompt(visible) { document.getElementById("prompt").style.display = visible ? "block" : "none"; }
    function setMachine(visible) { document.getElementById("machine").style.display = visible ? "block" : "none"; }
    function setCredits(n) { document.getElementById("credits").textContent = "Credits: " + n; }
    function setResult(text, jackpot) {
        var el = document.getElementById("result");
        el.textContent = text;
        el.className = jackpot ? "jackpot" : "";
    }
    // Spin to the final symbols; reels stop one after another over the duration (seconds).
    function spin(a, b, c, duration) {
        var finals = [a, b, c];
        setResult("", false);
        timers.forEach(clearInterval);
        timers = [];
        finals.forEach(function (final, i) {
            var el = document.getElementById("r" + i);
            el.classList.add("spinning");
            var stopAt = Date.now() + duration * 1000 * (0.45 + 0.275 * i);
            var timer = setInterval(function () {
                if (Date.now() >= stopAt) {
                    clearInterval(timer);
                    setReel(i, final);
                    return;
                }
                setReel(i, Math.floor(Math.random() * SYMBOLS.length));
                el.classList.add("spinning");
            }, 60);
            timers.push(timer);
        });
    }
</script>
</body>
</html>
